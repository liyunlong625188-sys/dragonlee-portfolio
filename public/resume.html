<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dragonlee</title>
    <link rel="icon" type="image/svg+xml" href="/assets/dragonlee-favicon.svg?v=1" />
    <style>
      * {
        box-sizing: border-box;
      }

      html {
        background: #f2f2f2;
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #f2f2f2;
        color: #111;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      .pdf-page {
        position: relative;
        overflow: hidden;
        width: min(100%, 1920px);
        margin: 0 auto;
        background: #fff;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.05), 0 24px 80px rgba(0, 0, 0, 0.12);
      }

      .pdf-page img {
        position: relative;
        z-index: 0;
        display: block;
        width: 100%;
        height: auto;
        opacity: 0;
        transform: translateY(18px) scale(1.006);
        transform-origin: top center;
        animation: page-in 0.9s cubic-bezier(0.2, 0.9, 0.2, 1) forwards;
      }

      .grainient-effect {
        position: absolute;
        z-index: 1;
        overflow: hidden;
        background: #050505;
        pointer-events: none;
        opacity: 0;
        transform-origin: center;
        animation: grainient-in 1s cubic-bezier(0.2, 0.9, 0.2, 1) 0.55s forwards;
      }

      .grainient-bar {
        left: calc(50 / 1920 * 100%);
        top: calc(51 / 25443 * 100%);
        width: calc(928 / 1920 * 100%);
        height: calc(68 / 25443 * 100%);
        transform: scaleX(0.94);
      }

      .grainient-orb {
        left: calc(566 / 1920 * 100%);
        top: calc(163 / 25443 * 100%);
        width: calc(412 / 1920 * 100%);
        aspect-ratio: 1;
        border-radius: 999px;
        transform: scale(0.84);
      }

      .grainient-effect canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .grainient-orb::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        box-shadow:
          inset 0 18px 44px rgba(255, 255, 255, 0.08),
          inset 0 -32px 58px rgba(0, 0, 0, 0.42);
        pointer-events: none;
      }

      .section-mask {
        position: absolute;
        left: 0;
        top: calc(var(--y) / 25443 * 100%);
        z-index: 1;
        width: calc(360 / 1920 * 100%);
        height: calc(var(--h, 270) / 25443 * 100%);
        background: #fff;
        pointer-events: none;
      }

      .section-anchor {
        position: absolute;
        left: calc(50 / 1920 * 100%);
        top: calc(var(--y) / 25443 * 100%);
        z-index: 7;
        width: calc(330 / 1920 * 100%);
        pointer-events: none;
        will-change: transform;
      }

      .section-number {
        display: block;
        color: #050505;
        font-size: calc(var(--page-scale, 1) * 118px);
        line-height: 0.78;
        font-weight: 900;
        letter-spacing: 0;
      }

      .section-title {
        display: block;
        margin-top: calc(var(--page-scale, 1) * 25px);
        color: #050505;
        font-size: calc(var(--page-scale, 1) * 19px);
        line-height: 1.1;
        font-weight: 800;
      }

      .hero-reveal {
        position: absolute;
        inset: 0 0 auto;
        z-index: 2;
        height: min(32.6vw, 626px);
        pointer-events: none;
        background: #fff;
        transform-origin: right center;
        animation: hero-reveal 1.15s cubic-bezier(0.76, 0, 0.24, 1) 0.3s forwards;
      }

      .hero-reveal::after {
        content: "";
        position: absolute;
        inset: 0 0 0 auto;
        width: min(1.4vw, 26px);
        background: #050505;
        transform: scaleY(0);
        transform-origin: top center;
        animation: reveal-edge 0.7s cubic-bezier(0.2, 0.9, 0.2, 1) 0.28s forwards;
      }

      @keyframes page-in {
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes hero-reveal {
        to {
          transform: translateX(104%);
        }
      }

      @keyframes reveal-edge {
        45%,
        100% {
          transform: scaleY(1);
        }
      }

      @keyframes grainient-in {
        to {
          opacity: 1;
          transform: none;
        }
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 720px) {
        html,
        body {
          background: #fff;
        }

        .pdf-page {
          box-shadow: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .pdf-page img {
          opacity: 1;
          transform: none;
          animation: none;
        }

        .hero-reveal {
          display: none;
        }

        .grainient-effect {
          opacity: 1;
          transform: none;
          animation: none;
        }

        .section-anchor {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="pdf-page" aria-label="Dragonlee PDF 原稿网页复刻">
      <h1 class="sr-only">Dragonlee 李云龙 Product Designer & Builder</h1>
      <img
        src="/resume-site/assets/pdf-preview/sips-render-edited.png"
        alt="Dragonlee 李云龙的 Product Designer & Builder 简历与作品集 PDF 原稿网页复刻"
        width="1920"
        height="25443"
      />
      <div class="section-mask" style="--y: 660" aria-hidden="true"></div>
      <div class="section-mask" style="--y: 2210" aria-hidden="true"></div>
      <div class="section-mask" style="--y: 4020; --h: 230" aria-hidden="true"></div>
      <div class="section-anchor" style="--y: 693" data-y="693" data-next="2243" aria-hidden="true">
        <span class="section-number">01</span>
        <span class="section-title">Basic Information</span>
      </div>
      <div class="section-anchor" style="--y: 2243" data-y="2243" data-next="4024" aria-hidden="true">
        <span class="section-number">02</span>
        <span class="section-title">Work Experience</span>
      </div>
      <div class="section-anchor" style="--y: 4024" data-y="4024" data-next="25443" aria-hidden="true">
        <span class="section-number">03</span>
        <span class="section-title">Portfolio</span>
      </div>
      <div class="grainient-effect grainient-bar" aria-hidden="true"></div>
      <div class="grainient-effect grainient-orb" aria-hidden="true"></div>
      <div class="hero-reveal" aria-hidden="true"></div>
    </main>
    <script>
      const grainientTargets = document.querySelectorAll(".grainient-effect");

      const hexToRgb = (hex) => {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        if (!result) return [1, 1, 1];
        return [
          parseInt(result[1], 16) / 255,
          parseInt(result[2], 16) / 255,
          parseInt(result[3], 16) / 255
        ];
      };

      const vertex = `#version 300 es
in vec2 position;
void main() {
  gl_Position = vec4(position, 0.0, 1.0);
}`;

      const fragment = `#version 300 es
precision highp float;
uniform vec2 iResolution;
uniform float iTime;
uniform float uTimeSpeed;
uniform float uColorBalance;
uniform float uWarpStrength;
uniform float uWarpFrequency;
uniform float uWarpSpeed;
uniform float uWarpAmplitude;
uniform float uBlendAngle;
uniform float uBlendSoftness;
uniform float uRotationAmount;
uniform float uNoiseScale;
uniform float uGrainAmount;
uniform float uGrainScale;
uniform float uGrainAnimated;
uniform float uContrast;
uniform float uGamma;
uniform float uSaturation;
uniform vec2 uCenterOffset;
uniform float uZoom;
uniform vec3 uColor1;
uniform vec3 uColor2;
uniform vec3 uColor3;
out vec4 fragColor;
#define S(a,b,t) smoothstep(a,b,t)
mat2 Rot(float a){float s=sin(a),c=cos(a);return mat2(c,-s,s,c);}
vec2 hash(vec2 p){p=vec2(dot(p,vec2(2127.1,81.17)),dot(p,vec2(1269.5,283.37)));return fract(sin(p)*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p),u=f*f*(3.0-2.0*f);float n=mix(mix(dot(-1.0+2.0*hash(i+vec2(0.0,0.0)),f-vec2(0.0,0.0)),dot(-1.0+2.0*hash(i+vec2(1.0,0.0)),f-vec2(1.0,0.0)),u.x),mix(dot(-1.0+2.0*hash(i+vec2(0.0,1.0)),f-vec2(0.0,1.0)),dot(-1.0+2.0*hash(i+vec2(1.0,1.0)),f-vec2(1.0,1.0)),u.x),u.y);return 0.5+0.5*n;}
void mainImage(out vec4 o, vec2 C){
  float t=iTime*uTimeSpeed;
  vec2 uv=C/iResolution.xy;
  float ratio=iResolution.x/iResolution.y;
  vec2 tuv=uv-0.5+uCenterOffset;
  tuv/=max(uZoom,0.001);

  float degree=noise(vec2(t*0.1,tuv.x*tuv.y)*uNoiseScale);
  tuv.y*=1.0/ratio;
  tuv*=Rot(radians((degree-0.5)*uRotationAmount+180.0));
  tuv.y*=ratio;

  float frequency=uWarpFrequency;
  float ws=max(uWarpStrength,0.001);
  float amplitude=uWarpAmplitude/ws;
  float warpTime=t*uWarpSpeed;
  tuv.x+=sin(tuv.y*frequency+warpTime)/amplitude;
  tuv.y+=sin(tuv.x*(frequency*1.5)+warpTime)/(amplitude*0.5);

  vec3 colLav=uColor1;
  vec3 colOrg=uColor2;
  vec3 colDark=uColor3;
  float b=uColorBalance;
  float s=max(uBlendSoftness,0.0);
  mat2 blendRot=Rot(radians(uBlendAngle));
  float blendX=(tuv*blendRot).x;
  float edge0=-0.3-b-s;
  float edge1=0.2-b+s;
  float v0=0.5-b+s;
  float v1=-0.3-b-s;
  vec3 layer1=mix(colDark,colOrg,S(edge0,edge1,blendX));
  vec3 layer2=mix(colOrg,colLav,S(edge0,edge1,blendX));
  vec3 col=mix(layer1,layer2,S(v0,v1,tuv.y));

  vec2 grainUv=uv*max(uGrainScale,0.001);
  if(uGrainAnimated>0.5){grainUv+=vec2(iTime*0.05);}
  float grain=fract(sin(dot(grainUv,vec2(12.9898,78.233)))*43758.5453);
  col+=(grain-0.5)*uGrainAmount;

  col=(col-0.5)*uContrast+0.5;
  float luma=dot(col,vec3(0.2126,0.7152,0.0722));
  col=mix(vec3(luma),col,uSaturation);
  col=pow(max(col,0.0),vec3(1.0/max(uGamma,0.001)));
  col=clamp(col,0.0,1.0);

  o=vec4(col,1.0);
}
void main(){
  vec4 o=vec4(0.0);
  mainImage(o,gl_FragCoord.xy);
  fragColor=o;
}`;

      const createShader = (gl, type, source) => {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          throw new Error(gl.getShaderInfoLog(shader) || "Shader compile failed");
        }
        return shader;
      };

      const createProgram = (gl, vert, frag) => {
        const program = gl.createProgram();
        gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vert));
        gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, frag));
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          throw new Error(gl.getProgramInfoLog(program) || "Program link failed");
        }
        return program;
      };

      const initGrainient = (container) => {
        const isBar = container.classList.contains("grainient-bar");
        const canvas = document.createElement("canvas");
        container.appendChild(canvas);
        const gl = canvas.getContext("webgl2", {
          alpha: false,
          antialias: false,
          premultipliedAlpha: false
        });
        if (!gl) return;

        const program = createProgram(gl, vertex, fragment);
        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

        const position = gl.getAttribLocation(program, "position");
        const uniforms = Object.fromEntries(
          [
            "iResolution",
            "iTime",
            "uTimeSpeed",
            "uColorBalance",
            "uWarpStrength",
            "uWarpFrequency",
            "uWarpSpeed",
            "uWarpAmplitude",
            "uBlendAngle",
            "uBlendSoftness",
            "uRotationAmount",
            "uNoiseScale",
            "uGrainAmount",
            "uGrainScale",
            "uGrainAnimated",
            "uContrast",
            "uGamma",
            "uSaturation",
            "uCenterOffset",
            "uZoom",
            "uColor1",
            "uColor2",
            "uColor3"
          ].map((name) => [name, gl.getUniformLocation(program, name)])
        );

        const colors = {
          color1: hexToRgb("#d8d8d8"),
          color2: hexToRgb("#525252"),
          color3: hexToRgb("#020202")
        };

        const setSize = () => {
          const rect = container.getBoundingClientRect();
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = Math.max(1, Math.floor(rect.width * dpr));
          canvas.height = Math.max(1, Math.floor(rect.height * dpr));
          gl.viewport(0, 0, canvas.width, canvas.height);
        };

        const render = (time) => {
          gl.useProgram(program);
          gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
          gl.enableVertexAttribArray(position);
          gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

          const virtualWidth = canvas.width;
          const virtualHeight = isBar ? Math.max(canvas.width * 0.72, canvas.height) : canvas.height;
          gl.uniform2f(uniforms.iResolution, virtualWidth, virtualHeight);
          gl.uniform1f(uniforms.iTime, time * 0.001);
          gl.uniform1f(uniforms.uTimeSpeed, isBar ? 0.82 : 0.62);
          gl.uniform1f(uniforms.uColorBalance, isBar ? -0.34 : -0.24);
          gl.uniform1f(uniforms.uWarpStrength, isBar ? 2.25 : 1.85);
          gl.uniform1f(uniforms.uWarpFrequency, isBar ? 1.35 : 2.85);
          gl.uniform1f(uniforms.uWarpSpeed, isBar ? 4.1 : 3.2);
          gl.uniform1f(uniforms.uWarpAmplitude, isBar ? 18 : 22);
          gl.uniform1f(uniforms.uBlendAngle, isBar ? -8 : -24);
          gl.uniform1f(uniforms.uBlendSoftness, isBar ? 0.18 : 0.04);
          gl.uniform1f(uniforms.uRotationAmount, isBar ? 360 : 520);
          gl.uniform1f(uniforms.uNoiseScale, isBar ? 0.72 : 1.35);
          gl.uniform1f(uniforms.uGrainAmount, isBar ? 0.04 : 0.055);
          gl.uniform1f(uniforms.uGrainScale, isBar ? 1.55 : 2.8);
          gl.uniform1f(uniforms.uGrainAnimated, 1);
          gl.uniform1f(uniforms.uContrast, isBar ? 1.72 : 2.05);
          gl.uniform1f(uniforms.uGamma, 1);
          gl.uniform1f(uniforms.uSaturation, 0);
          gl.uniform2f(uniforms.uCenterOffset, isBar ? 0.0 : 0.02, isBar ? 0.44 : -0.02);
          gl.uniform1f(uniforms.uZoom, isBar ? 1.55 : 0.9);
          gl.uniform3fv(uniforms.uColor1, colors.color1);
          gl.uniform3fv(uniforms.uColor2, colors.color2);
          gl.uniform3fv(uniforms.uColor3, colors.color3);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        };

        let raf = 0;
        let visible = true;
        let pageVisible = !document.hidden;

        const loop = (time) => {
          render(time);
          raf = requestAnimationFrame(loop);
        };

        const start = () => {
          if (!raf && visible && pageVisible) raf = requestAnimationFrame(loop);
        };

        const stop = () => {
          if (raf) cancelAnimationFrame(raf);
          raf = 0;
        };

        new ResizeObserver(() => {
          setSize();
          render(performance.now());
        }).observe(container);

        new IntersectionObserver(([entry]) => {
          visible = entry.isIntersecting;
          visible ? start() : stop();
        }).observe(container);

        document.addEventListener("visibilitychange", () => {
          pageVisible = !document.hidden;
          pageVisible ? start() : stop();
        });

        setSize();
        start();
      };

      if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        grainientTargets.forEach((target) => {
          try {
            initGrainient(target);
          } catch {
            target.style.background = "linear-gradient(110deg, #050505, #4a4a4a 42%, #151515 68%, #020202)";
          }
        });
      }

      const pdfPage = document.querySelector(".pdf-page");
      const sectionAnchors = [...document.querySelectorAll(".section-anchor")];
      const sourceWidth = 1920;
      let ticking = false;

      const updateSectionAnchors = () => {
        const rect = pdfPage.getBoundingClientRect();
        const pageTop = window.scrollY + rect.top;
        const scale = rect.width / sourceWidth;
        const stickyTop = 24;
        const viewportTopSource = (window.scrollY + stickyTop - pageTop) / Math.max(scale, 0.001);

        document.documentElement.style.setProperty("--page-scale", scale);

        sectionAnchors.forEach((anchor) => {
          const sourceY = Number(anchor.dataset.y);
          const nextY = Number(anchor.dataset.next);
          const heightSource = anchor.offsetHeight / Math.max(scale, 0.001);
          const maxY = Math.max(sourceY, nextY - heightSource - 96);
          const targetY = Math.min(Math.max(sourceY, viewportTopSource), maxY);
          anchor.style.transform = `translateY(${Math.max(0, (targetY - sourceY) * scale)}px)`;
        });

        ticking = false;
      };

      const requestSectionUpdate = () => {
        if (!ticking) {
          ticking = true;
          requestAnimationFrame(updateSectionAnchors);
        }
      };

      window.addEventListener("scroll", requestSectionUpdate, { passive: true });
      window.addEventListener("resize", requestSectionUpdate);
      updateSectionAnchors();
    </script>
  </body>
</html>
